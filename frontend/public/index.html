<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="赛博鱼缸 - BSC 链上 GameFi + NFT 游戏" />
  
  <title>Cyber Aquarium | 赛博鱼缸</title>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      font-family: 'Courier New', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
        'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
        sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: #0a0e27;
      color: #0ff;
      overflow: hidden;
    }
    
    code {
      font-family: source-code-pro, Menlo, Monaco, Consolas, 'Courier New',
        monospace;
    }
    
    #root {
      width: 100vw;
      height: 100vh;
    }
    
    /* 加载动画 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #0a0e27 0%, #1a1a2e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }
    
    .loading-logo {
      font-size: 48px;
      margin-bottom: 20px;
      animation: float 3s ease-in-out infinite;
    }
    
    .loading-text {
      color: #0ff;
      font-size: 24px;
      text-shadow: 0 0 10px #0ff;
      margin-bottom: 30px;
    }
    
    .loading-bar {
      width: 300px;
      height: 4px;
      background: rgba(0, 255, 255, 0.2);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    
    .loading-bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 50%;
      background: #0ff;
      box-shadow: 0 0 10px #0ff;
      animation: loading 1.5s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    @keyframes loading {
      0% { left: -50%; }
      100% { left: 100%; }
    }
    
    /* 扫描线效果 */
    .scanlines {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0, 255, 255, 0.03) 0px,
        transparent 2px
      );
      pointer-events: none;
      z-index: 9998;
    }
  </style>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  
  <!-- 加载屏幕 -->
  <div class="loading-screen" id="loading">
    <div class="loading-logo">🐟</div>
    <div class="loading-text">CYBER AQUARIUM</div>
    <div class="loading-bar"></div>
  </div>
  
  <!-- 扫描线效果 -->
  <div class="scanlines"></div>
  
  <!-- React 根节点 -->
  <div id="root"></div>
  
  <script>
    // 加载完成后隐藏加载屏幕
    window.addEventListener('load', function() {
      setTimeout(function() {
        document.getElementById('loading').style.display = 'none';
      }, 1000);
    });
  </script>
</body>
</html>
